<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹅鹏骑自行车 · SVG 2D 动画</title>
<style>
:root{--ink:#18324b;--muted:#59728b;--sky:#dff4ff;--cream:#fff9ee;--accent:#ff8a4c;--teal:#20a6a6;--duration:9s}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5fbff 0%,#fff8ee 100%);font-family:ui-rounded,"Trebuchet MS","Microsoft YaHei",sans-serif;color:var(--ink);padding:24px}
.page{width:min(1100px,100%);background:rgba(255,255,255,.76);border:1px solid rgba(24,50,75,.12);border-radius:22px;box-shadow:0 24px 70px rgba(44,91,122,.16);overflow:hidden}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:24px 28px 16px;background:#ffffffb8;border-bottom:1px solid rgba(24,50,75,.08)}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:800}.title{margin:4px 0 5px;font-size:clamp(24px,4vw,38px);line-height:1.08}.subtitle{margin:0;color:var(--muted);font-size:14px}.badge{white-space:nowrap;background:#fff1df;color:#a65a22;border:1px solid #ffd7ae;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}
.stage{padding:18px 22px 4px}.frame{position:relative;border-radius:16px;overflow:hidden;background:#dff4ff;border:1px solid #b7dae7;box-shadow:inset 0 0 0 1px #ffffff80}.frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 20%,#ffffff2e 45%,transparent 72%);mix-blend-mode:screen}
svg{display:block;width:100%;height:auto}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 4px 16px}.btn,.speed{appearance:none;border:1px solid #b9d2dd;background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;transition:.2s ease;box-shadow:0 2px 0 #dcebf0}.btn:hover,.speed:hover{transform:translateY(-1px);border-color:#7fb9c6}.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 0 #147a80}.speed{padding-right:32px}.hint{margin-left:auto;color:var(--muted);font-size:12px}.footer{display:flex;justify-content:space-between;gap:16px;padding:0 28px 22px;color:#6c8396;font-size:12px}.footer strong{color:var(--ink)}
#bikeRide{animation:bikeRide var(--duration) ease-in-out infinite;animation-play-state:paused}.moving #bikeRide{animation-play-state:running}.is-paused *{animation-play-state:paused!important}.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}.pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}.riderBob{animation:bob 1.1s ease-in-out infinite}.wing{transform-box:fill-box;transform-origin:18% 50%;animation:wing 1.1s ease-in-out infinite}.cloud{animation:cloud 18s linear infinite}.cloud.slow{animation-duration:28s}.grass{animation:sway 2.2s ease-in-out infinite alternate}.spark{animation:twinkle 1.6s ease-in-out infinite}.spark:nth-of-type(2){animation-delay:.4s}.spark:nth-of-type(3){animation-delay:.8s}
@keyframes bikeRide{0%{transform:translateX(-18px)}50%{transform:translateX(22px)}100%{transform:translateX(-18px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes wing{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}@keyframes cloud{from{transform:translateX(-150px)}to{transform:translateX(1050px)}}@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
@media (max-width:700px){body{padding:10px}.header{padding:18px 18px 14px}.stage{padding:12px 12px 0}.footer{padding:0 18px 17px;flex-direction:column;gap:5px}.hint{width:100%;margin-left:0}}
</style>
</head>
<body>
<main class="page">
<header class="header"><div><div class="kicker">SVG MOTION STUDY · 02</div><h1 class="title">鹅鹏骑自行车</h1><p class="subtitle">一只鹅鹏沿着湖畔小路出发，车轮、翅膀和云朵都在呼吸。</p></div><div class="badge">纯 SVG · 无外部资源</div></header>
<section class="stage"><div class="frame">
<svg id="scene" viewBox="0 0 1000 560" role="img" aria-label="鹅鹏骑着自行车沿湖畔道路前进的二维动画">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bdeaff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79cdd8"/><stop offset="1" stop-color="#b5edf0"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6d39c"/><stop offset="1" stop-color="#dfb77e"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1000" height="560" fill="url(#sky)"/><circle cx="833" cy="94" r="46" fill="#ffd978" opacity=".92"/><circle cx="833" cy="94" r="65" fill="#ffe9a9" opacity=".28" filter="url(#soft)"/>
<g class="cloud" opacity=".86" fill="#fff"><path d="M54 128c0-19 16-34 35-34 6-24 28-41 54-41 28 0 51 19 56 45 5-3 12-5 18-5 21 0 38 16 38 36H54z"/></g>
<g class="cloud slow" opacity=".66" fill="#fff"><path d="M620 165c0-15 12-27 28-27 5-20 23-33 44-33 23 0 42 16 46 37 5-3 10-4 16-4 18 0 31 13 31 29H620z"/></g>
<path d="M0 294 Q160 245 310 292 T620 286 T1000 270 V408 H0Z" fill="#96d58c"/><path d="M0 330 Q180 280 360 331 T710 322 T1000 308 V420 H0Z" fill="#5dbb81"/>
<path d="M0 366 Q170 329 334 364 T670 355 T1000 342 V560 H0Z" fill="url(#water)" opacity=".96"/><path d="M0 394 Q180 368 360 394 T730 390 T1000 378" fill="none" stroke="#e7ffff" stroke-width="5" opacity=".72"/><path d="M0 426 Q160 404 330 426 T680 422 T1000 410" fill="none" stroke="#e7ffff" stroke-width="3" opacity=".55"/>
<path d="M0 435 Q210 399 410 430 Q606 461 1000 415 L1000 560 H0Z" fill="url(#road)"/><path d="M0 475 Q230 439 430 470 T1000 457" fill="none" stroke="#fff2c9" stroke-width="8" stroke-dasharray="26 22" opacity=".9"/>
<g class="grass" stroke="#398d65" stroke-width="4" stroke-linecap="round"><path d="M78 444l-8-23m8 23l8-27m-8 27l18-18"/><path d="M905 435l-8-24m8 24l10-29m-10 29l18-19"/><path d="M192 405l-6-17m6 17l10-20"/><path d="M790 393l-6-20m6 20l12-21"/></g>
<g fill="#4b9b68"><path d="M122 350c0-42 32-76 70-76s70 34 70 76H122z"/><rect x="179" y="349" width="13" height="56" rx="6" fill="#8b674b"/><path d="M745 350c0-37 28-68 62-68s62 31 62 68H745z"/><rect x="799" y="348" width="12" height="52" rx="6" fill="#8b674b"/></g>
<g id="bikeRide">
<ellipse cx="505" cy="497" rx="124" ry="16" fill="#9b6e52" opacity=".22"/>
<g class="wheel" fill="none" stroke="#18324b" stroke-width="8"><circle cx="427" cy="438" r="48"/><circle cx="610" cy="438" r="48"/></g>
<g fill="none" stroke="#4f7183" stroke-width="3" opacity=".9"><circle cx="427" cy="438" r="38"/><circle cx="610" cy="438" r="38"/><path d="M427 390v96m-48-48h96M610 390v96m-48-48h96"/></g>
<g fill="none" stroke="#18324b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M427 438L492 396 610 438 544 438 492 396 470 438"/><path d="M492 396l-10-39m-10 0h25m103 81l17-37m-18 0h30"/></g>
<g class="pedal" fill="none" stroke="#ff8a4c" stroke-width="6"><circle cx="544" cy="438" r="15"/><path d="M544 438l17-13m-17 13l-16 13"/></g>
<g class="riderBob">
<path d="M454 346c-17-30-9-65 18-82 29-18 70-6 83 25 12 29-2 61-31 73-25 10-55 3-70-16z" fill="#fffaf1" stroke="#18324b" stroke-width="6"/>
<path d="M497 273c17-21 55-22 73 2 8 11 11 24 8 37-11-18-23-22-40-18-16 4-30-3-41-21z" fill="#ffcf62"/>
<circle cx="530" cy="296" r="6" fill="#18324b"/><circle cx="532" cy="294" r="2" fill="#fff"/><path d="M546 310l33 8-29 14z" fill="#ff8a4c" stroke="#18324b" stroke-width="4" stroke-linejoin="round"/>
<path d="M475 328c-21 4-35 18-43 36l30 10c12-17 25-24 38-28z" fill="#f7f0e5" stroke="#18324b" stroke-width="5"/>
<path class="wing" d="M468 330c-20-9-45-2-55 17 22 3 37 13 47 28 12-7 20-17 24-29z" fill="#fffaf1" stroke="#18324b" stroke-width="5"/>
<path d="M505 350l-21 47m55-47l24 44" fill="none" stroke="#ff8a4c" stroke-width="9" stroke-linecap="round"/><path d="M483 397l-13 31m68-34l22 29" fill="none" stroke="#18324b" stroke-width="7" stroke-linecap="round"/>
<path d="M492 353h50" stroke="#18324b" stroke-width="6" stroke-linecap="round"/>
</g></g>
<g fill="#ff8a4c" class="spark"><path d="M340 260l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path d="M695 250l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M751 300l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
<text x="46" y="520" fill="#5e7f8f" font-size="14" font-weight="700">LAKE LOOP · 08:42 AM</text>
</svg></div>
<div class="controls"><button id="toggle" class="btn primary" type="button">暂停动画</button><button id="replay" class="btn" type="button">重新播放</button><label><span class="sr-only">速度</span><select id="speed" class="speed" aria-label="动画速度"><option value="12s">慢速 · 0.75x</option><option value="9s" selected>标准 · 1x</option><option value="6s">轻快 · 1.5x</option></select></label><span class="hint" id="state">正在骑行 · 点击暂停</span></div></section>
<footer class="footer"><span><strong>操作：</strong>暂停、重播或调整骑行速度</span><span>SVG + CSS keyframes</span></footer>
</main>
<script>
const scene=document.getElementById('scene'),toggle=document.getElementById('toggle'),replay=document.getElementById('replay'),speed=document.getElementById('speed'),state=document.getElementById('state');
let paused=false;
function setPaused(next){paused=next;scene.classList.toggle('is-paused',paused);toggle.textContent=paused?'继续播放':'暂停动画';state.textContent=paused?'已暂停 · 点击继续':'正在骑行 · 点击暂停';}
toggle.addEventListener('click',()=>setPaused(!paused));
replay.addEventListener('click',()=>{scene.classList.remove('moving');void scene.offsetWidth;scene.classList.add('moving');setPaused(false);state.textContent='重新出发 · 正在骑行';});
speed.addEventListener('change',e=>{document.documentElement.style.setProperty('--duration',e.target.value);state.textContent='速度已调整 · 正在骑行';});
scene.classList.add('moving');
</script>
</body></html>

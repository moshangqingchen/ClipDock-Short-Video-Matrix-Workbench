# 待审阅的两条匿名诊断规则；不是完整 mihomo 配置，禁止覆盖现有配置。
# 合并到当前 rules 列表首条 IP-CIDR/IP-CIDR6 之前，保留原 3341 条规则及其顺序。
# 本文件未自动应用；规则命中 DIRECT 只说明策略选择，不等于大陆出口许可。
# myip：匿名 HTTPS 来源回显，用于建立实际直连通路类的 IPv4/IPv6 出口样本。
# 请求最终使用哪个地址族、物理接口及是否同业务通路，仍需实际核验。
  - DOMAIN,myip.ipip.net,DIRECT
# api6：IPv6 专用匿名回显，用于区分可能的 IPv6 出路；不能单凭成功认定 DIRECT/CN。
# 两个回显目标独立取证；各自样本不自动互认，也不自动授权国内业务 host。
  - DOMAIN,api6.ipify.org,DIRECT
# 地理查询仅处理匿名出口元数据，此处没有扩大其路由许可，也没有业务账号凭据。
